<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vielen Dank – Gastropix</title>
  <!-- Google Fonts für konsistentes Design -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #B8874F;
      --secondary-color: #0B2E30;
      --dark-color: #0B2E30;
      --background-color: #FAF9F6;
      --text-color: #262422;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text-color);
      background-color: var(--background-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .thank-you-card {
      background: white;
      padding: 60px 40px;
      border-radius: 3px;
      border: 1px solid rgba(11, 46, 48, 0.12);
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 2.2rem;
      color: var(--secondary-color);
      margin-top: 0;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    p {
      font-size: 1.05em;
      color: var(--text-color);
      line-height: 1.65;
      margin-bottom: 35px;
    }

    .cta-button {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1.05em;
      color: white;
      background-color: var(--secondary-color);
      padding: 16px 34px;
      border-radius: 3px;
      border: none;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .cta-button:hover {
      background-color: var(--primary-color);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="thank-you-card">
    <h1>Vielen Dank!</h1>
    <p>Deine Nachricht wurde erfolgreich übermittelt. Wir haben deine Anfrage erhalten und melden uns zeitnah mit einem passenden Vorschlag bei dir.</p>
    <a href="/" class="cta-button">Zurück zur Startseite</a>
  </div>

</body>
</html>
