<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vielen Dank!</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      color: #111;
      font-size: 1.8rem;
    }
    p {
      color: #555;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      background-color: #000;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Vielen Dank!</h1>
    <p>Deine Nachricht wurde erfolgreich übermittelt. Wir melden uns so schnell wie möglich bei dir.</p>
    <a href="/" class="btn">Zurück zur Startseite</a>
  </div>

</body>
</html>
